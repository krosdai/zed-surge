id = "surge"
name = "Surge"
version = "0.1.0"
schema_version = 1
authors = ["xdanger <y@dai.co>"]
description = "Syntax highlighting for Surge (nssurge.com) configuration files"
repository = "https://github.com/krosdai/zed-surge"

# The grammar lives at the root of this same repository. Zed clones it at `rev`
# and compiles src/parser.c with wasi-sdk — it never runs `tree-sitter
# generate`, so the generated sources have to stay committed.
#
# After changing the grammar, commit the generated sources first, then point
# `rev` at that commit SHA in a follow-up manifest commit. Zed's shallow fetch
# does not create a local ref for tags, so tag names cannot be checked out here.
[grammars.surge]
repository = "https://github.com/krosdai/zed-surge"
rev = "8ca56cddb57d26cc17f10548ccedf29452638faa"
