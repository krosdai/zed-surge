# Dependabot version updates.
# Ecosystems mirror the root manifests: pnpm (npm), plus the GitHub Actions used
# in .github/workflows. No uv or cargo entries — this repository has no Python or
# Rust sources.
# Docs: https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  # JavaScript — package.json + pnpm-lock.yaml (linters, formatters, tree-sitter CLI).
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    assignees:
      - "xdanger"
    groups:
      npm-minor-patch:
        update-types:
          - "minor"
          - "patch"

  # GitHub Actions used by the CI workflows.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    assignees:
      - "xdanger"
    groups:
      actions-minor-patch:
        update-types:
          - "minor"
          - "patch"
